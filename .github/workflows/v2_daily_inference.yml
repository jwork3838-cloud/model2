name: V2 MLB HR Engine (Phase 7)

on:
  schedule:
    # Runs at 10:00 AM EST (14:00 UTC) every day
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  run-v2-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache V2 Data and Models
        uses: actions/cache@v3
        with:
          path: |
            v2_engine/v2_mlb_cache
            v2_engine/v2_mlb_models
          # Cache key rotates daily so it saves the new data each day
          key: v2-mlb-cache-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            v2-mlb-cache-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pyarrow xgboost lightgbm catboost scikit-learn optuna gspread filelock

      - name: Run V2 Pipeline
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          V2_SHEET_ID: "1l8R0cyNJCe3CIQm9tm3jK6eoDlmhHX7Z0_GwblOfeGQ"
        working-directory: ./v2_engine
        run: |
          echo "Step 1: Updating PA Dataset..."
          python build_pa_dataset.py
          
          echo "Step 2: Building Base Features..."
          python build_features.py
          
          echo "Step 3: Building BvP Features..."
          python build_bvp_features.py
          
          echo "Step 4: Running Master Engine (Advanced Features, Train, Predict, Publish)..."
          python mlb_hr_engine.py
